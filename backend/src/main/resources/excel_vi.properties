excel.file.templateSuffix=mau
excel.sheet.templateGuide=Hướng dẫn
excel.template.title=Hướng dẫn điền file mẫu
excel.template.sheet=Sheet
excel.template.colName=Cột
excel.template.colRequired=Bắt buộc
excel.template.colExample=Ví dụ
excel.template.colNote=Ghi chú
excel.template.required=Bắt buộc
excel.note.command=Mỗi dòng cần nhập phải ghi lệnh, để trống = bỏ qua dòng. MERGE = thêm mới hoặc sửa theo mã; CREATE chỉ thêm; UPDATE chỉ sửa; DELETE xoá
excel.template.step.universal1=1. Mỗi sheet là một loại dữ liệu; điền từ dòng 2, giữ nguyên dòng tiêu đề, ghi MERGE ở cột Lệnh cho mỗi dòng cần nhập. Sheet không dùng có thể để trống hoặc xoá.
excel.template.step.universal2=2. Nhập theo thứ tự: phòng ban → chức vụ → bậc lương → ca → loại phép → nhân viên → số dư phép → phân ca (hệ thống tự xếp đúng thứ tự khi nhập cả file).
excel.template.step.universal3=3. Ngày ghi dd/MM/yyyy (vd. 01/11/2026), giờ ghi HH:mm (vd. 08:00). Cột có (*) là bắt buộc.
excel.template.step.universal4=4. Vào Import / Export → Nhập dữ liệu → chọn file → kiểm tra bản xem trước → xác nhận. Không cần xoá sheet Hướng dẫn này.
excel.template.step.screen1=1. Điền từ dòng 2 của sheet dữ liệu, giữ nguyên dòng tiêu đề; mỗi dòng là một bản ghi. Cột có (*) là bắt buộc.
excel.template.step.screen2=Xong thì bấm Nhập Excel ở màn tương ứng → kiểm tra bản xem trước → xác nhận. Không cần xoá sheet Hướng dẫn này.
excel.template.step.contract1=2. Ngày ghi yyyy-mm-dd. Sheet "Phụ cấp" thay toàn bộ phụ cấp của các hợp đồng có trong file; chỉ sửa hợp đồng mà không muốn đụng phụ cấp thì xoá sheet "Phụ cấp".
excel.template.step.holiday1=2. Ngày ghi yyyy-mm-dd. Năm nào chưa sửa thì đang dùng lịch lễ mẫu; nhập file sẽ chép lịch mẫu năm đó sang công ty rồi áp thay đổi.
