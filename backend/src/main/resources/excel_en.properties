# File mẫu nhập Excel (ExcelTemplate): hướng dẫn + ví dụ / ghi chú theo cột (excel.col.X → excel.example.X / excel.note.X)
excel.file.templateSuffix=template
excel.sheet.templateGuide=Guide
excel.template.title=How to fill in this template
excel.template.sheet=Sheet
excel.template.colName=Column
excel.template.colRequired=Required
excel.template.colExample=Example
excel.template.colNote=Notes
excel.template.required=Required
excel.note.command=Every row to import needs a command; blank = row is skipped. MERGE = create or update by code; CREATE only creates; UPDATE only updates; DELETE deletes
excel.template.step.universal1=1. Each sheet is one kind of data; fill from row 2, keep the header row and put MERGE in the Command column of every row to import. Unused sheets can stay empty or be deleted.
excel.template.step.universal2=2. Import order: departments → positions → salary grades → shifts → leave types → employees → leave balances → shift assignments (the whole file is imported in this order automatically).
excel.template.step.universal3=3. Dates as dd/MM/yyyy (e.g. 01/11/2026), times as HH:mm (e.g. 08:00). Columns marked (*) are required.
excel.template.step.universal4=4. Go to Import / Export → Import data → choose the file → check the preview → confirm. No need to delete this Guide sheet.
excel.template.step.screen1=1. Fill from row 2 of the data sheet and keep the header row; one row per record. Columns marked (*) are required.
excel.template.step.screen2=Then click Import Excel on the matching screen → check the preview → confirm. No need to delete this Guide sheet.
excel.template.step.contract1=2. Dates as yyyy-mm-dd. The "Allowances" sheet replaces all allowances of the contracts in the file; to edit contracts only, delete the "Allowances" sheet.
excel.template.step.holiday1=2. Dates as yyyy-mm-dd. A year you have not edited uses the template holidays; importing copies that year to your company first, then applies the changes.
