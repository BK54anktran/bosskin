# Profile prod (Procfile: -Dspring.profiles.active=prod). Mọi giá trị nhạy cảm lấy từ biến môi trường,
# danh sách đầy đủ trong docs/runbook.md. Không ghi đè cấu hình Flyway của application.yml:
# prod cũng chạy validate-on-migrate, không baseline, không clean.
server:
  port: ${PORT:5000}
  # Sau nginx/ALB: tin X-Forwarded-* để log đúng IP và scheme
  forward-headers-strategy: native

spring:
  datasource:
    # DB_URL đầy đủ, vd: jdbc:mysql://<rds-endpoint>:3306/bosskin?sslMode=REQUIRED&serverTimezone=Asia/Ho_Chi_Minh
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: ${DB_POOL_SIZE:10}

logging:
  level:
    com.bosskin: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: WARN
