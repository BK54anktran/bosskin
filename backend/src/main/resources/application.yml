spring:
  application:
    name: bosskin

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bosskin?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:bosskin}
    password: ${DB_PASSWORD:bosskin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 10000   # fail sau 10s thay vì retry mãi
      connection-timeout: 5000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          "[batch_size]": 50
        "[order_inserts]": true
        "[order_updates]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    connection-timeout: 120000   # 2 phút cho import file lớn

app:
  jwt:
    secret: ${JWT_SECRET:bosskin-super-secret-key-change-in-production-2024}
    expiration: 86400000       # 24 hours
    refresh-expiration: 604800000  # 7 days

  s3:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-southeast-1}
    bucket: ${AWS_S3_BUCKET:}
    endpoint: ${AWS_S3_ENDPOINT:}   # để trống nếu dùng AWS thật, điền nếu dùng MinIO

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081

  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

  # Ô bản đồ OSM đi qua BE (MapTileController) — FE không gọi thẳng tile.openstreetmap.org
  map-tiles:
    upstream-url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    user-agent: ${MAP_TILE_USER_AGENT:BossKin-HR/1.0 (map tile proxy)}   # OSM khuyên ghi kèm email/URL liên hệ
    cache-dir: ${MAP_TILE_CACHE_DIR:${user.home}/.bosskin/map-tiles}
    max-cache-mb: ${MAP_TILE_MAX_CACHE_MB:1024}   # đầy thì xoá ô cũ nhất
    refresh-after-days: 30        # ô cũ hơn thì tải lại
    min-zoom: 5
    max-zoom: 18
    rate-limit-per-minute: 600    # số ô / phút / người dùng
    max-concurrent-upstream: 4    # số lượt tải đồng thời sang OSM
    bbox:                         # Việt Nam, gồm Hoàng Sa & Trường Sa
      min-lat: 6.0
      max-lat: 23.6
      min-lon: 102.0
      max-lon: 118.0

logging:
  level:
    com.bosskin: DEBUG
    org.springframework.security: INFO
