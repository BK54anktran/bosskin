spring:
  application:
    name: bosskin

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/bosskin?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:bosskin}
    password: ${DB_PASSWORD:bosskin123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:bosskin-super-secret-key-change-in-production-2024}
    expiration: 86400000       # 24 hours
    refresh-expiration: 604800000  # 7 days

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081

logging:
  level:
    com.bosskin: DEBUG
    org.springframework.security: INFO
