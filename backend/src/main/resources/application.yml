spring:
  application:
    name: bosskin

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bosskin?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:bosskin}
    password: ${DB_PASSWORD:bosskin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 10000   # fail sau 10s thay vì retry mãi
      connection-timeout: 5000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          "[batch_size]": 50
        "[order_inserts]": true
        "[order_updates]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1 là baseline gộp trước go-live: chỉ chạy trên DB trống, DB cũ (V1–V117) phải tạo lại
    baseline-on-migrate: false
    # Chỉ dev\reset-db.cmd mới mở (SPRING_FLYWAY_CLEAN_DISABLED=false); prod luôn cấm clean
    clean-disabled: ${SPRING_FLYWAY_CLEAN_DISABLED:true}
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    # Lỗi nghiệp vụ trả mã lỗi qua ApiExceptionHandler; trang lỗi mặc định không lộ chi tiết
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    connection-timeout: 120000   # 2 phút cho import file lớn

app:
  trial-request:
    max-per-ip-hour: ${TRIAL_MAX_PER_IP_HOUR:5}   # form dùng thử ở trang giới thiệu (V12)
  # Đặt cả hai → yêu cầu dùng thử đọc/ghi bảng trial_requests trên Supabase (trang Netlify ghi thẳng vào đó).
  # Khoá bí mật (sb_secret_… hoặc service_role) chỉ để ở biến môi trường, không commit.
  supabase:
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
  security:
    # Bước C: system admin luôn phải dùng 2FA (TOTP). Chỉ tắt cho test tự động.
    require-sysadmin-2fa: ${REQUIRE_SYSADMIN_2FA:true}

  # System admin đầu tiên, chỉ dùng khi DB chưa có system admin nào (xem SystemAdminBootstrap)
  bootstrap:
    sysadmin-email: ${BOOTSTRAP_SYSADMIN_EMAIL:}
    sysadmin-password: ${BOOTSTRAP_SYSADMIN_PASSWORD:}
    add-sysadmin-email: ${BOOTSTRAP_ADD_SYSADMIN_EMAIL:}        # thêm 1 system admin lúc khởi động nếu email chưa có
    add-sysadmin-password: ${BOOTSTRAP_ADD_SYSADMIN_PASSWORD:}

  jwt:
    # Bắt buộc đặt JWT_SECRET (>= 32 ký tự, ngẫu nhiên). Không có giá trị mặc định.
    # Tạo nhanh: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION_MS:1800000}  # 30 phút (access token); FE tự refresh
    refresh-expiration: 604800000  # 7 days

  s3:
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}
    region: ${AWS_REGION:ap-southeast-1}
    bucket: ${AWS_S3_BUCKET:}
    endpoint: ${AWS_S3_ENDPOINT:}   # để trống nếu dùng AWS thật, điền nếu dùng MinIO

  cors:
    # Origin được gọi API từ trình duyệt (bản web). Prod: đặt CORS_ALLOWED_ORIGINS=https://app.ten-mien.vn
    # Hỗ trợ pattern, vd http://localhost:* cho flutter run -d chrome (cổng ngẫu nhiên)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

  firebase:
    # Khoá service account KHÔNG nằm trong git. Chọn một trong hai:
    #  - FIREBASE_SERVICE_ACCOUNT_JSON: nội dung JSON (hoặc base64 của JSON)
    #  - FIREBASE_SERVICE_ACCOUNT_PATH: đường dẫn file trên máy chủ
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

  # Ô bản đồ OSM đi qua BE (MapTileController) — FE không gọi thẳng tile.openstreetmap.org
  map-tiles:
    upstream-url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    user-agent: ${MAP_TILE_USER_AGENT:BossKin-HR/1.0 (map tile proxy)}   # OSM khuyên ghi kèm email/URL liên hệ
    cache-dir: ${MAP_TILE_CACHE_DIR:${user.home}/.bosskin/map-tiles}
    max-cache-mb: ${MAP_TILE_MAX_CACHE_MB:1024}   # đầy thì xoá ô cũ nhất
    refresh-after-days: 30        # ô cũ hơn thì tải lại
    min-zoom: 5
    max-zoom: 18
    rate-limit-per-minute: 600    # số ô / phút / người dùng
    max-concurrent-upstream: 4    # số lượt tải đồng thời sang OSM
    bbox:                         # Việt Nam, gồm Hoàng Sa & Trường Sa
      min-lat: 6.0
      max-lat: 23.6
      min-lon: 102.0
      max-lon: 118.0

# Bước 2 — health check cho EB / load balancer: GET /actuator/health → {"status":"UP"} (kèm kiểm DB).
# Chỉ mở health; chi tiết thành phần không lộ ra ngoài. Các endpoint actuator khác không mở.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true          # /actuator/health/liveness, /actuator/health/readiness
  health:
    # S3/mail… không ảnh hưởng việc nhận request; chỉ DB và ổ đĩa quyết định UP/DOWN
    diskspace:
      enabled: true

logging:
  # Mỗi dòng log kèm mã request [rid] (RequestIdFilter)
  pattern:
    level: "%5p [%X{rid:-}]"
  level:
    com.bosskin: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: INFO
