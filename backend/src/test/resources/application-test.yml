spring:
  flyway:
    # Test luôn kiểm checksum migration, phát hiện file migration bị sửa sau khi đã chạy
    validate-on-migrate: true
  jpa:
    show-sql: false

app:
  security:
    # Test nghiệp vụ đăng nhập system admin không cần 2FA; luồng 2FA có test riêng (TwoFactorTest)
    require-sysadmin-2fa: false
  jwt:
    # Chỉ dùng cho test
    secret: test-only-jwt-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  bootstrap:
    sysadmin-email: sysadmin@test.local
    sysadmin-password: Test-SysAdmin-123
  s3:
    # Không gọi S3 thật khi test; giá trị giả chỉ để khởi tạo client
    access-key: test
    secret-key: test
    bucket: bosskin-test
    endpoint: http://localhost:9
  documents:
    # Tài liệu nhân sự lưu thư mục tạm khi test (không gọi S3)
    storage: local
    local-dir: ${java.io.tmpdir}/bosskin-test-documents
  firebase:
    # Không bao giờ dùng service account thật khi chạy test
    service-account-path: /nonexistent/firebase-test.json
  map-tiles:
    cache-dir: ${java.io.tmpdir}/bosskin-test-map-tiles

logging:
  level:
    com.bosskin: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
