# Trang giới thiệu + /help/ — tương đương phần header / chặn đường dẫn trong netlify.toml.
# add_header trong location không kế thừa từ server → khai lại ở từng location.
server {
  listen 8080;
  listen 3000;   # Vibe Host trỏ lưu lượng vào 3000 khi không nhận ra framework
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # sitemap.xml / robots.txt sinh bởi help/tools/build_help.py và viết tay; khai rõ kiểu nội dung cho Google
  location = /sitemap.xml {
    default_type application/xml;
    types { }
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }
  # Ảnh / video / gói dựng bài mạng xã hội (Metricool và tác vụ đăng bài lấy qua link công khai)
  location /social/ {
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }
  location /help/img/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ =404;
  }
}
