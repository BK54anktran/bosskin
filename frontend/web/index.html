<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BossKin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BossKin</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="env.js"></script>
  <script>
    // Trang đang mở thì trình duyệt không tự hiện thông báo đẩy → app gọi hàm này (core/config/runtime_host_web.dart)
    window.bosskinNotify = function (title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var opts = { body: body || '', icon: 'icons/Icon-192.png', badge: 'icons/Icon-192.png' };
      var plain = function () { try { new Notification(title, opts); } catch (e) {} };
      if (!('serviceWorker' in navigator)) return plain();
      // Dùng service worker đang có (của Firebase Messaging — Flutter mới không còn đăng ký service worker gốc,
      // nên navigator.serviceWorker.ready có thể không bao giờ xong). Android Chrome bắt buộc hiện qua service worker.
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        var reg = regs.filter(function (r) { return r.active; })[0];
        if (reg) return reg.showNotification(title, opts);
        plain();
      }).catch(plain);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
