name: bosskin
description: BossKin - Chấm công, tính lương, quản lý nhân sự
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Local storage
  flutter_secure_storage: ^9.0.0
  qr_flutter: ^4.1.0   # Bước C: mã QR cài 2FA
  shared_preferences: ^2.2.3

  # UI Components
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  table_calendar: ^3.1.1
  intl: ^0.20.2

  # Map & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # File picker & saver
  image_picker: ^1.1.2
  http_parser: ^4.0.2
  path_provider: ^2.1.4

  # Color picker
  flutter_colorpicker: ^1.1.0

  # Firebase — push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # Utils
  uuid: ^4.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  flutter_map_cancellable_tile_provider: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: "assets/images/icon_bosskin.png"
    background_color: "#FFFFFF"
  windows:
    generate: false
  image_path: "assets/images/icon_bosskin.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_bosskin.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
  # fonts: uncomment và thêm file .ttf vào assets/fonts/ khi có
