# Phục vụ bản web Flutter: route phía client (go_router) trả về index.html; index / main.dart.js / flutter_bootstrap.js / service worker / env.js không cache
# (build với --pwa-strategy=none: không để service worker giữ bản cũ — trước đây phải xoá dữ liệu trình duyệt mới thấy tính năng mới sau khi triển khai, 17/10/2026).
# add_header khai trong location không kế thừa từ server → mỗi location tự khai lại hai header bảo mật.
server {
  listen 8080;
  listen 3000;   # Vibe Host trỏ lưu lượng vào 3000 khi không nhận ra framework
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location = /index.html                 { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
  location = /main.dart.js               { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
  location = /flutter_bootstrap.js       { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
  location = /flutter_service_worker.js  { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
  location = /version.json               { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
  location = /firebase-messaging-sw.js   { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
  location = /env.js                     { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; }
  # /assets/ tên file không đổi giữa các bản (font icon rút gọn theo icon đang dùng, ảnh, bản dịch) → no-cache: trình duyệt hỏi lại
  # mỗi lần (không đổi thì 304). Trước đây cache 7 ngày làm icon mới không hiện sau khi triển khai (14/10/2026).
  # v<build>/assets/… (flutter_bootstrap.js đặt assetBase theo số build) → cùng file trong /assets/
  location ~ ^/v[0-9]+/(assets/.*)$ { rewrite ^/v[0-9]+/(assets/.*)$ /$1 last; }
  location /assets/ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; try_files $uri =404; }
  location / {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }
}
