version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: bosskin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: bosskin
      MYSQL_USER: bosskin
      MYSQL_PASSWORD: bosskin123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bosskin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: bosskin
      DB_PASSWORD: bosskin123
      JWT_SECRET: bosskin-super-secret-key-change-in-production-2024
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bosskin?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    ports:
      - "8080:8080"

volumes:
  mysql_data:
    driver: local
