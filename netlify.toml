# Netlify: host trang giới thiệu (landing/) — trang tĩnh, không cần build.
# Kết nối repo trên Netlify là đủ; mỗi lần push main có thay đổi trong landing/ sẽ tự deploy.
[build]
  base    = "landing"
  publish = "."
  command = ""
  # Bỏ qua deploy khi commit không đụng tới landing/ (tiết kiệm phút build)
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Thư mục script dựng video và README không cần công khai
[[redirects]]
  from = "/video/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true
