name: Frontend build

# Bước B: tự build bản web và APK Android cho mỗi push đụng frontend (và chạy tay được).
# - Kiểm tra: flutter analyze (lỗi mới chặn; cảnh báo cũ chưa chặn), chuỗi tiếng Việt viết cứng, flutter test.
# - Web: build release, API_HOST lấy từ biến repo vars.API_HOST (Settings → Variables; production: https://api.bosskin.io.vn).
#   Nhánh main: gói web được đăng thành bosskin-web.tar.gz ở release "web-latest" — frontend/Dockerfile tải file này.
# - APK: có secrets ANDROID_KEYSTORE_BASE64 (+ ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)
#   thì ký bằng khoá thật; chưa có thì APK ký khoá debug (chỉ để thử nội bộ). Xem docs/runbook.md mục 10.
# - Nhánh main + có khoá thật: APK được đăng thành bosskin.apk ở release "app-latest" — trang giới thiệu (nút "Tải cho Android")
#   tải file này. Khoá gốc: frontend/android/app/release.jks + key.properties trên máy dev (không commit), xem landing/README.md.
# - Số phiên bản: tên theo pubspec, số build = số lần chạy workflow (versionCode luôn tăng).
on:
  # Chỉ main (đăng gói web / APK) và PR (kiểm tra) — nhánh làm việc không build riêng, tránh chạy trùng
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'tools/ci/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'tools/ci/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

permissions:
  contents: write   # đăng APK lên release app-latest

# Commit mới trên cùng nhánh / PR huỷ lượt build cũ đang chạy (lượt mới đã gồm thay đổi cũ)
concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Android)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Ghim phiên bản đã build thử thành công (Gradle 8.14.3, AGP 8.11.1, Kotlin 2.2.20).
          # Nâng Flutter → nâng cả ba nếu Flutter đòi, build thử rồi mới đổi số ở đây.
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze (chặn lỗi)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Chuỗi tiếng Việt viết cứng
        working-directory: .
        run: python3 tools/ci/check_vi_literals.py

      - name: Test (quyền vào màn, menu nhóm, bản dịch mã lỗi backend)
        run: flutter test

      - name: Build web
        run: flutter build web --release --dart-define=API_HOST=${{ vars.API_HOST }} --build-number=${{ github.run_number }}

      # frontend/Dockerfile tải gói này về thay vì build Flutter trên máy build của nền tảng host (Vibe Host chỉ chờ ~5 phút).
      # Đăng ngay sau khi build web, không chờ APK, để triển khai lại bản web được sớm.
      - name: Đăng gói web lên release web-latest (chỉ nhánh main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "$RUNNER_TEMP/bosskin-web.tar.gz" -C build/web .
          ls -la "$RUNNER_TEMP/bosskin-web.tar.gz"
          gh release view web-latest >/dev/null 2>&1 || gh release create web-latest \
            --title "Gói web (bản build mới nhất của main)" --prerelease \
            --notes "File do workflow frontend-build.yml tự cập nhật; frontend/Dockerfile tải về khi build image."
          gh release upload web-latest "$RUNNER_TEMP/bosskin-web.tar.gz" --clobber
          gh release edit web-latest --notes "Commit: ${GITHUB_SHA}  ·  Build: $(date -u +%Y-%m-%dT%H:%M:%SZ)  ·  Run: ${GITHUB_RUN_NUMBER}"

      - name: Android signing (nếu có khoá)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Chưa có ANDROID_KEYSTORE_BASE64 — APK ký bằng khoá debug, không dùng để phát hành."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --dart-define=API_HOST=${{ vars.API_HOST }} --build-number=${{ github.run_number }}

      - name: Upload web
        uses: actions/upload-artifact@v4
        with:
          name: bosskin-web-${{ github.run_number }}
          path: frontend/build/web
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bosskin-apk-${{ github.run_number }}
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Đăng APK đã ký lên release app-latest (chỉ nhánh main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f android/key.properties ]; then
            echo "::warning::APK ký khoá debug — không đăng lên release."
            exit 0
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/bosskin.apk"
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NOTES="File cài BossKin cho Android (bosskin.apk), ký bằng khoá phát hành. Phiên bản $VER · build ${GITHUB_RUN_NUMBER} · commit ${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)"
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "BossKin cho Android (bản mới nhất)" --notes "$NOTES"
          gh release upload app-latest "$RUNNER_TEMP/bosskin.apk" --clobber
          gh release edit app-latest --notes "$NOTES"
