name: Deploy to Elastic Beanstalk

# Bước 2: deploy bằng tay (Actions → Deploy to Elastic Beanstalk → Run workflow), không tự deploy mỗi lần
# push main — push code dev không đụng môi trường thật. Test vẫn chạy cho mọi push (test.yml).
on:
  workflow_dispatch:

jobs:
  # Test phải xanh thì mới deploy (Mốc 0 — trước đây build bỏ qua test)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        working-directory: backend
        # Test đã chạy ở job "test"; ở đây chỉ đóng gói
        run: mvn clean package -DskipTests -q

      - name: Create deploy package
        working-directory: backend
        # Jar + Procfile ở gốc gói (Procfile chạy "bosskin-1.0.0.jar"), kèm .ebextensions (health check, PORT)
        run: |
          zip -j deploy.zip target/bosskin-1.0.0.jar Procfile
          zip -r deploy.zip .ebextensions

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          region: ${{ secrets.AWS_REGION }}
          version_label: ${{ github.sha }}
          deployment_package: backend/deploy.zip
