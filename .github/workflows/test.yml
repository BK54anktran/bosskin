name: Backend tests

# Chạy test cho mọi push (kể cả main) và mọi pull request đụng backend.
# deploy.yml (chạy tay) cũng chạy lại test trước khi deploy.
on:
  push:
    paths:
      - 'backend/**'
      - 'tools/ci/check_error_keys.py'
      - 'tools/docs/**'
      - 'docs/he-thong/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Mã lỗi có bản dịch vi + en
        run: python3 tools/ci/check_error_keys.py

      # api.md sinh từ controller; csdl.md phải ghi đúng migration mới nhất (sinh lại: tools/docs/gen_he_thong.py)
      - name: Tài liệu hệ thống khớp code
        run: python3 tools/docs/gen_he_thong.py --check

      # Integration test dùng Testcontainers (MySQL 8) — Docker có sẵn trên ubuntu-latest
      - name: Run tests
        working-directory: backend
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
