name: Backend tests

# Chạy test cho mọi push (kể cả main) và mọi pull request đụng backend.
# deploy.yml (chạy tay) cũng chạy lại test trước khi deploy.
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Integration test dùng Testcontainers (MySQL 8) — Docker có sẵn trên ubuntu-latest
      - name: Run tests
        working-directory: backend
        run: mvn -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
