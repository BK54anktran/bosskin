name: Frontend checks

# Kiểm tra nhanh phía Flutter (không deploy): chặn chuỗi tiếng Việt viết cứng mới.
# Chữ hiển thị phải đi qua l10n (frontend/lib/l10n/app_*.arb); xem tools/ci/check_vi_literals.py.
on:
  push:
    paths:
      - 'frontend/lib/**'
      - 'tools/ci/**'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    paths:
      - 'frontend/lib/**'
      - 'tools/ci/**'
      - '.github/workflows/frontend-check.yml'

jobs:
  vi-literals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Chuỗi tiếng Việt viết cứng trong .dart
        run: python3 tools/ci/check_vi_literals.py
